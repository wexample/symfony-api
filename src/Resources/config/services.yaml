services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
    # Used to validate api urls requests arguments.
    Wexample\SymfonyApi\:
        resource: '../../{Command,HealthCheck,Log,Security,Service,Twig}'
        # Registered by the extension, where the application enables it.
        exclude: '../../Service/UserTokenPasswordLoginService.php'
        tags: ['controller.service_arguments']

    Wexample\SymfonyApi\EventSubscriber\:
        resource: '../../EventSubscriber/*'
        # Registered by the extension, where symfony-activity is enabled.
        exclude: '../../EventSubscriber/ApiTokenActivitySubscriber.php'
        tags: ['kernel.event_subscriber']

    Wexample\SymfonyApi\Controller\:
        resource: '../../Controller/*'
        tags: ['controller.service_arguments']

    Wexample\SymfonyApi\Normalizer\:
        resource: '../../Normalizer/*'
        tags: ['serializer.normalizer']

    Wexample\SymfonyApi\Api\Controller\Test\:
        resource: '../../Api/Controller/Test/*'
        tags: ['controller.service_arguments']