framework:
  test: true
  secret: "test"
  session:
    storage_factory_id: session.storage.factory.mock_file

doctrine:
  orm:
    enable_native_lazy_objects: true
    mappings:
      FixtureApp:
        type: attribute
        dir: '%kernel.project_dir%/Entity'
        prefix: 'Wexample\SymfonyApi\Tests\Fixtures\App\Entity'
        is_bundle: false

wexample_symfony_api:
  machine_token:
    token_class: Wexample\SymfonyApi\Tests\Fixtures\App\Entity\DeviceToken
    prefix: fx_dev_
    rate_limit:
      client: { limit: 20, interval: '1 hour' }
      ip_failures: { limit: 8, interval: '1 hour' }
  user_token:
    token_class: Wexample\SymfonyApi\Tests\Fixtures\App\Entity\PersonToken
    prefix: fx_usr_
    rate_limit:
      client: { limit: 20, interval: '1 hour' }
      ip_failures: { limit: 8, interval: '1 hour' }
  batch:
    record_class: Wexample\SymfonyApi\Tests\Fixtures\App\Entity\IdempotencyRecord
  versions:
    v1:
      deprecation: '2026-09-01'
      sunset: '2027-03-01'
      link: 'https://example.com/api/v1-sunset'

security:
  providers:
    people:
      memory:
        users:
          jane: { password: secret, roles: [ROLE_USER] }
    persons:
      entity:
        class: Wexample\SymfonyApi\Tests\Fixtures\App\Entity\Person
        property: email
    everyone:
      chain:
        providers: [people, persons]
  firewalls:
    # Before the page firewall, which would otherwise match it first.
    machine:
      pattern: ^/api/device/
      stateless: true
      # Several providers exist: Symfony asks for one, which the token
      # handler's own loader makes unused.
      provider: people
      access_token:
        token_handler: Wexample\SymfonyApi\Security\MachineTokenHandler
        failure_handler: Wexample\SymfonyApi\Security\MachineTokenAuthenticationFailureHandler
      entry_point: Wexample\SymfonyApi\Security\MachineTokenAuthenticationFailureHandler
      user_checker: Wexample\SymfonyApi\Tests\Fixtures\App\Security\DeviceChecker
    scripts:
      pattern: ^/api/script/
      stateless: true
      provider: persons
      access_token:
        token_handler: Wexample\SymfonyApi\Security\UserTokenHandler
        failure_handler: Wexample\SymfonyApi\Security\UserTokenAuthenticationFailureHandler
      entry_point: Wexample\SymfonyApi\Security\UserTokenAuthenticationFailureHandler
      user_checker: Wexample\SymfonyApi\Tests\Fixtures\App\Security\DeviceChecker
    main:
      lazy: true
      provider: everyone
  access_control:
    - { path: ^/api/device/, roles: ROLE_MACHINE }
    - { path: ^/api/script/import, roles: ROLE_IMPORTER }
    - { path: ^/api/script/, roles: ROLE_USER }
    - { path: ^/api/user-tokens, roles: ROLE_USER }
    - { path: ^/page, roles: ROLE_USER }
    - { path: ^/api/app/, roles: ROLE_USER }

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Wexample\SymfonyApi\Tests\Fixtures\App\Security\:
    resource: '../Security/'

  Wexample\SymfonyApi\Tests\Fixtures\App\Normalizer\:
    resource: '../Normalizer/'

  Wexample\SymfonyApi\Tests\Fixtures\App\HealthCheck\:
    resource: '../HealthCheck/'

  Wexample\SymfonyApi\Tests\Fixtures\App\Controller\:
    resource: '../Controller/'
    tags: ['controller.service_arguments']

  # symfony-testing registers it with the string '@kernel' instead of a
  # reference, which only YAML turns into the kernel service.
  Wexample\SymfonyHelpers\Service\BundleService:
    arguments: ['@kernel']

wexample_symfony_loader:
  front_paths:
    front: '%kernel.project_dir%/../front/'

# Every record of every channel, kept for the tests to read.
monolog:
  handlers:
    test:
      type: test
      level: debug

nelmio_api_doc:
  documentation:
    openapi: 3.1.0
    info:
      title: Fixture device API
      version: 1.0.0
  areas:
    default:
      path_patterns: ['^/api/device/(?!v\d+/)']
    app:
      path_patterns: ['^/api/app/']
    ops:
      path_patterns: ['^/api/health$']
    tokens:
      path_patterns: ['^/api/user-tokens']
    script:
      path_patterns: ['^/api/script/']
    v1:
      path_patterns: ['^/api/device/v1/']
      documentation:
        info: { title: Fixture device API, version: v1 }
    v2:
      path_patterns: ['^/api/device/v2/']
      documentation:
        info: { title: Fixture device API, version: v2 }
